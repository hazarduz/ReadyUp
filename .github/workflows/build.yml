name: Build ReadyUp

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build & publish (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ReadyUp.sln

      - name: Build (Release)
        run: dotnet build ReadyUp.sln -c Release --no-restore

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/ReadyUp.App/ReadyUp.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/win-x64

      - name: Smoke test - launch the published exe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "publish/win-x64/ReadyUp.exe" -PassThru
          Start-Sleep -Seconds 10
          $proc.Refresh()

          if ($proc.HasExited) {
            Write-Error "ReadyUp exited within 10 seconds of starting (exit code $($proc.ExitCode)) - it likely crashed on startup before showing any window."
            exit 1
          }

          if ($proc.MainWindowTitle -ne "ReadyUp") {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Error "ReadyUp is running but its main window title is '$($proc.MainWindowTitle)' instead of 'ReadyUp' - it's likely stuck on an error dialog instead of showing the library window."
            exit 1
          }

          Write-Host "Smoke test passed: main window '$($proc.MainWindowTitle)' is showing."
          Stop-Process -Id $proc.Id -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadyUp-win-x64
          path: publish/win-x64/**
          if-no-files-found: error

      - name: Zip build for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath ReadyUp-win-x64.zip

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReadyUp build ${{ github.run_number }}
          files: ReadyUp-win-x64.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
