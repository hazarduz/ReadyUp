name: Build ReadyUp

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build & publish (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ReadyUp.sln

      - name: Build (Release)
        run: dotnet build ReadyUp.sln -c Release --no-restore

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/ReadyUp.App/ReadyUp.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/win-x64

      - name: Smoke test - launch the published exe
        shell: pwsh
        run: |
          # MainWindowTitle alone isn't reliable here: when a startup exception
          # fires an error MessageBox, the original window can still be the one
          # .NET reports as "main" while the dialog sits on top of it - a prior
          # version of this check reported success while the app was actually
          # stuck on a fatal error dialog. Instead, enumerate every top-level
          # window belonging to the process and check all of their titles.
          Add-Type @"
            using System;
            using System.Text;
            using System.Runtime.InteropServices;
            using System.Collections.Generic;
            public static class WinEnum {
              public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc lpEnumFunc, IntPtr lParam);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
              [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr hWnd, StringBuilder lpString, int nMaxCount);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint lpdwProcessId);
              public static List<string> GetTitlesForProcess(int pid) {
                var titles = new List<string>();
                EnumWindows((hWnd, lParam) => {
                  GetWindowThreadProcessId(hWnd, out uint windowPid);
                  if (windowPid == (uint)pid && IsWindowVisible(hWnd)) {
                    var sb = new StringBuilder(256);
                    GetWindowText(hWnd, sb, 256);
                    if (sb.Length > 0) titles.Add(sb.ToString());
                  }
                  return true;
                }, IntPtr.Zero);
                return titles;
              }
            }
"@

          $proc = Start-Process -FilePath "publish/win-x64/ReadyUp.exe" -PassThru
          Start-Sleep -Seconds 10
          $proc.Refresh()

          if ($proc.HasExited) {
            Write-Error "ReadyUp exited within 10 seconds of starting (exit code $($proc.ExitCode)) - it likely crashed on startup before showing any window."
            exit 1
          }

          $titles = [WinEnum]::GetTitlesForProcess($proc.Id)
          Write-Host "Visible windows: $($titles -join ', ')"
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

          $errorWindow = $titles | Where-Object { $_ -match "Error" -or $_ -match "Exception" }
          if ($errorWindow) {
            Write-Error "ReadyUp showed an error dialog on startup: '$errorWindow'"
            exit 1
          }

          if (-not ($titles -contains "ReadyUp")) {
            Write-Error "No window titled exactly 'ReadyUp' was found among: $($titles -join ', ')"
            exit 1
          }

          Write-Host "Smoke test passed: 'ReadyUp' window is showing, no error dialogs."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadyUp-win-x64
          path: publish/win-x64/**
          if-no-files-found: error

      - name: Zip build for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath ReadyUp-win-x64.zip

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReadyUp build ${{ github.run_number }}
          files: ReadyUp-win-x64.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
